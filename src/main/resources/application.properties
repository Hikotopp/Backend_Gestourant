spring.application.name=gestourant-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestourant?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.error.include-message=never
server.port=${PORT:8081}
server.forward-headers-strategy=framework
jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-por-una-de-al-menos-32-caracteres}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.admin-registration-code=${ADMIN_REGISTRATION_CODE:GestourantAdmin2026}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.turnstile.site-key=${TURNSTILE_SITE_KEY:}
app.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
app.oauth.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
app.backup.s3.bucket=${BACKUP_S3_BUCKET:}
app.backup.s3.region=${BACKUP_S3_REGION:us-east-1}
app.backup.s3.endpoint=${BACKUP_S3_ENDPOINT:}
app.backup.s3.prefix=${BACKUP_S3_PREFIX:gestourant/backups}
app.backup.mysqldump-command=${MYSQLDUMP_COMMAND:mysqldump}
app.backup.mysql-command=${MYSQL_COMMAND:mysql}
logging.file.name=${LOG_FILE:logs/gestourant.log}
logging.level.com.gestourant=INFO
